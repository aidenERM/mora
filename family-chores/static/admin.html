<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>home chores admin</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="shell"><section id="login" class="card narrow"><p class="eyebrow">home chores</p><h1>admin</h1><form id="login-form" class="stack"><label>admin password<input id="password" type="password" required></label><button>open admin</button><p id="error" class="error"></p></form></section><section id="app" class="hidden"><header class="top"><div><p class="eyebrow">home chores</p><h1>schedule editor</h1></div><a class="button secondary" href="/">family view</a></header><section class="card"><h2>Week A anchor</h2><form id="settings" class="stack"><input id="anchor" type="date" required><button>save anchor</button></form></section><div class="grid"><section class="card"><h2>people</h2><form id="member-form" class="stack"><input id="member-id" type="hidden"><input id="member-name" placeholder="name" required><input id="member-slug" placeholder="slug, optional"><button>save person</button></form><div id="member-list"></div></section><section class="card"><h2>chores</h2><form id="chore-form" class="stack"><input id="chore-id" type="hidden"><input id="chore-name" placeholder="chore name" required><input id="chore-time" placeholder="suggested time, e.g. 18:00"><textarea id="chore-description" placeholder="friendly detail"></textarea><button>save chore</button></form><div id="chore-list"></div></section></div><section class="card"><h2>assignments</h2><form id="assignment-form" class="stack"><input id="assignment-id" type="hidden"><select id="assignment-member" required></select><select id="assignment-chore" required></select><select id="assignment-week"><option>A</option><option>B</option></select><select id="assignment-day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select><textarea id="assignment-notes" placeholder="optional note"></textarea><button>save assignment</button></form><div id="assignment-list"></div></section><section class="card"><h2>exceptions</h2><form id="exception-form" class="stack"><input id="exception-date" type="date" required><select id="exception-type"><option>skip</option><option>swap</option><option>replace</option><option>vacation</option><option>note</option></select><select id="exception-member"><option value="">everyone</option></select><input id="exception-assignment" type="number" placeholder="assignment id, optional"><select id="replacement-chore"><option value="">replacement chore</option></select><select id="replacement-member"><option value="">replacement person</option></select><textarea id="exception-note" placeholder="note"></textarea><button>save exception</button></form><div id="exception-list"></div></section></section></main><script src="/static/admin.js"></script></body></html>
