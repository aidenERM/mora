# Install after official login and the decision-provider smoke test.
# The CLI cannot execute Orbit actions. It only returns schema-validated decisions.
[Service]
Environment=ORBIT_CODEX_ENABLED=1
Environment=ORBIT_CODEX_HOME=/var/lib/pulse/codex
Environment=ORBIT_CODEX_MODEL=gpt-5.6-sol
# Luna passed a single decision but looped during real multi-step Discord QA.
# Keep the reliable workhorse at low effort until a cheaper planner passes QA.
Environment=ORBIT_CODEX_MODEL_FAST=gpt-5.6-sol
Environment=ORBIT_CODEX_MODEL_CODEX=gpt-5.6-sol
Environment=ORBIT_CODEX_MODEL_STRONG=gpt-5.6-sol
# CLI process + Python worker need more than the original 256 MB limit.
MemoryMax=512M
